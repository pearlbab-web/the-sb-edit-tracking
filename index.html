
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The SB Edit | Track Your Order</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff5f9;
      color: #222;
    }
    header {
      background: #111;
      color: #ff8fbd;
      text-align: center;
      padding: 28px 15px;
    }
    header h1 { letter-spacing: 3px; }
    header p { color: white; }
    main {
      max-width: 420px;
      margin: 30px auto;
      padding: 24px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 18px #00000012;
    }
    label { display: block; margin-top: 18px; }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 8px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #ddd; }
    button {
      margin-top: 22px;
      border: 0;
      background: #ff8fbd;
      color: #111;
      font-weight: bold;
    }
    #result { margin-top: 20px; line-height: 1.6; }
    footer { text-align: center; padding: 20px; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>THE SB EDIT</h1>
    <p>more than just skirts</p>
  </header>

  <main>
    <h2>Track Your Order 💗</h2>
    <p>Enter your order number and the phone number used when ordering.</p>

    <label for="order">Order Number</label>
    <input id="order" type="text" placeholder="e.g. SB001">

    <label for="phone">Phone Number</label>
    <input id="phone" type="tel" placeholder="Phone number used when ordering">

    <button id="trackButton" onclick="trackOrder()">Track My Order</button>
    <div id="result" role="status"></div>
  </main>

  <footer>Thank you for shopping with The SB Edit 💕</footer>

  <script>
    const SUPABASE_URL = "https://uicqsmatzichyfluatjo.supabase.co";
const SUPABASE_KEY = "sb_publishable_yo4yt7C39tiIGfVbojWJZg_cNx2E3h1";
  

    async function trackOrder() {
      const order = document.getElementById("order").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const result = document.getElementById("result");
      const button = document.getElementById("trackButton");

      if (!order || !phone) {
        result.textContent = "Please enter both your order number and phone number.";
        return;
      }

      if (SUPABASE_URL.includes("PASTE_YOUR") ||
          SUPABASE_KEY.includes("PASTE_YOUR")) {
        result.textContent = "The tracking connection still needs to be configured.";
        return;
      }

      button.disabled = true;
      result.textContent = "Checking your order...";

      try {
        const response = await fetch(
          SUPABASE_URL.replace(/\/$/, "") +
          "/rest/v1/rpc/track_sb_edit_order",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + SUPABASE_KEY
            },
            body: JSON.stringify({
              p_order_number: order,
              p_phone_number: phone
            })
          }
        );

        if (!response.ok) {
          throw new Error("Tracking request failed");
        }

        const data = await response.json();

        if (!data || data.length === 0) {
          result.textContent =
            "Order not found. Check your details or contact The SB Edit.";
        } else {
          result.textContent =
            "Order: " + data[0].order_number +
            " | Status: " + data[0].status;
        }
      } catch (error) {
        result.textContent =
          "We couldn't check your order right now. Please try again later.";
      } finally {
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
